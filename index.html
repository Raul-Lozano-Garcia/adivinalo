<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
  <meta name="apple-mobile-web-app-title" content="¡Adivínalo!" />
  <link rel="manifest" href="manifest.json" />
  <title>¡Adivínalo!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --accent-green: #00ff88;
      --accent-red: #ff2d55;
      --accent-yellow: #ffd600;
      --text: #f5f5f5;
      --text-dim: #888;
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow Condensed', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Force landscape */
    #rotate-notice {
      display: none;
      position: fixed; inset: 0;
      background: var(--bg);
      flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      gap: 20px;
    }
    #rotate-notice .icon { font-size: 64px; animation: spin 2s ease-in-out infinite; }
    #rotate-notice p { font-size: 22px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }
    @keyframes spin {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media (orientation: portrait) {
      #rotate-notice { display: flex; }
      #app { display: none; }
    }

    /* APP */
    #app {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ── SCREENS ── */
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 40px;
      transition: opacity .35s ease, transform .35s ease;
      opacity: 0; pointer-events: none;
      transform: scale(.97);
    }
    .screen.active {
      opacity: 1; pointer-events: all;
      transform: scale(1);
    }

    /* ── HOME ── */
    #screen-home {
      background: radial-gradient(ellipse at 30% 50%, #1a2a1a 0%, var(--bg) 60%);
    }
    .home-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(64px, 12vw, 100px);
      letter-spacing: 6px;
      line-height: 1;
      text-align: center;
      background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-yellow) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(0,255,136,.3));
    }
    .home-subtitle {
      font-size: 16px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 8px;
      margin-bottom: 48px;
    }
    .btn-start {
      background: var(--accent-green);
      color: #000;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 4px;
      padding: 18px 64px;
      border-radius: 60px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 0 40px rgba(0,255,136,.4);
    }
    .btn-start:active { transform: scale(.95); }

    .home-instructions {
      margin-top: 40px;
      display: flex; gap: 32px;
    }
    .instr-item {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim);
    }
    .instr-icon {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .instr-icon.green { background: rgba(0,255,136,.15); border: 2px solid rgba(0,255,136,.4); }
    .instr-icon.red   { background: rgba(255,45,85,.15);  border: 2px solid rgba(255,45,85,.4); }

    /* ── READY ── */
    #screen-ready {
      background: var(--bg);
    }
    .ready-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(40px, 8vw, 72px);
      letter-spacing: 4px;
      text-align: center;
      color: var(--accent-yellow);
    }
    .ready-desc {
      font-size: 18px; color: var(--text-dim);
      text-align: center; margin-top: 12px;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .countdown {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(80px, 18vw, 160px);
      color: var(--accent-green);
      filter: drop-shadow(0 0 40px rgba(0,255,136,.5));
      line-height: 1;
      margin-top: 8px;
    }

    /* ── GAME ── */
    #screen-game {
      padding: 0;
    }
    .game-bg {
      position: absolute; inset: 0;
      transition: background .25s ease;
    }
    .game-bg.neutral  { background: linear-gradient(160deg, #111 0%, #0d0d0d 100%); }
    .game-bg.correct  { background: linear-gradient(160deg, #002a1a 0%, #001510 100%); }
    .game-bg.pass     { background: linear-gradient(160deg, #2a000d 0%, #150007 100%); }

    .game-header {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px;
      z-index: 2;
    }
    .score-display {
      display: flex; gap: 20px;
    }
    .score-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 16px; border-radius: 40px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 2px;
    }
    .score-chip.green { background: rgba(0,255,136,.15); color: var(--accent-green); border: 1.5px solid rgba(0,255,136,.3); }
    .score-chip.red   { background: rgba(255,45,85,.15);  color: var(--accent-red);   border: 1.5px solid rgba(255,45,85,.3); }

    .timer-bar-wrap {
      position: absolute; bottom: 0; left: 0; right: 0; height: 5px; z-index: 2;
      background: rgba(255,255,255,.08);
    }
    .timer-bar {
      height: 100%; background: var(--accent-yellow);
      transition: width .1s linear;
      box-shadow: 0 0 12px rgba(255,214,0,.6);
    }

    .word-center {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100%; height: 100%;
    }
    .word-category {
      font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 16px;
    }
    .word-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(52px, 11vw, 110px);
      letter-spacing: 4px;
      text-align: center;
      line-height: 1.05;
      padding: 0 40px;
      transition: transform .2s, opacity .2s;
    }

    .tilt-hint {
      position: absolute; z-index: 2;
      font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,.2);
      display: flex; align-items: center; gap: 8px;
      transition: opacity .3s;
    }
    .tilt-hint.top    { top: 56px; left: 50%; transform: translateX(-50%); flex-direction: column; }
    .tilt-hint.bottom { bottom: 20px; left: 50%; transform: translateX(-50%); flex-direction: column-reverse; }
    .tilt-arrow { font-size: 22px; }

    /* feedback flash */
    .feedback-flash {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      opacity: 0; pointer-events: none;
      transition: opacity .15s;
    }
    .feedback-flash.show { opacity: 1; }
    .feedback-emoji { font-size: 72px; }
    .feedback-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px; letter-spacing: 6px;
    }

    /* ── RESULTS ── */
    #screen-results {
      background: radial-gradient(ellipse at 70% 50%, #1a1a2a 0%, var(--bg) 60%);
    }
    .results-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(44px, 9vw, 80px);
      letter-spacing: 5px;
      text-align: center;
      background: linear-gradient(135deg, var(--accent-yellow), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .results-scores {
      display: flex; gap: 32px; margin: 28px 0;
    }
    .result-block {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 20px 32px; border-radius: var(--radius);
    }
    .result-block.green { background: rgba(0,255,136,.1); border: 2px solid rgba(0,255,136,.25); }
    .result-block.red   { background: rgba(255,45,85,.1);  border: 2px solid rgba(255,45,85,.25); }
    .result-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px; line-height: 1;
    }
    .result-block.green .result-num { color: var(--accent-green); }
    .result-block.red   .result-num { color: var(--accent-red); }
    .result-label { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); }

    .btn-replay {
      background: transparent;
      color: var(--text);
      border: 2px solid rgba(255,255,255,.25);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 4px;
      padding: 14px 48px;
      border-radius: 60px;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-replay:hover { border-color: var(--accent-green); color: var(--accent-green); }

    /* animations */
    @keyframes wordIn {
      from { transform: translateY(12px) scale(.95); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
    .word-animate { animation: wordIn .3s cubic-bezier(.22,1,.36,1) forwards; }

    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,.4); }
      50% { box-shadow: 0 0 0 16px rgba(0,255,136,0); }
    }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,45,85,.4); }
      50% { box-shadow: 0 0 0 16px rgba(255,45,85,0); }
    }
  </style>
</head>
<body>

<!-- Rotate notice -->
<div id="rotate-notice">
  <div class="icon">📱</div>
  <p>Gira el móvil horizontalmente</p>
</div>

<div id="app">

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="home-logo">¡Adivínalo!</div>
    <div class="home-subtitle">El juego de las palabras</div>
    <button class="btn-start" id="btn-start">JUGAR</button>
    <div class="home-instructions">
      <div class="instr-item">
        <div class="instr-icon green">↑</div>
        <span>Inclina arriba<br>= ACIERTO</span>
      </div>
      <div class="instr-item">
        <div class="instr-icon red">↓</div>
        <span>Inclina abajo<br>= PASO</span>
      </div>
    </div>
  </div>

  <!-- READY -->
  <div id="screen-ready" class="screen">
    <div class="ready-title">Prepárate…</div>
    <div class="ready-desc">Coloca el móvil en la frente</div>
    <div class="countdown" id="countdown">3</div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="game-bg neutral" id="game-bg"></div>

    <div class="game-header">
      <div class="score-display">
        <div class="score-chip green">✓ <span id="score-correct">0</span></div>
        <div class="score-chip red">✗ <span id="score-pass">0</span></div>
      </div>
      <div style="font-size:13px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase">
        <span id="word-index">1</span> / <span id="word-total">20</span>
      </div>
    </div>

    <div class="tilt-hint top">
      <span class="tilt-arrow">▲</span>
      <span>ACIERTO</span>
    </div>

    <div class="word-center">
      <div class="word-category" id="word-category">Adivina</div>
      <div class="word-text" id="word-text">—</div>
    </div>

    <div class="tilt-hint bottom">
      <span class="tilt-arrow">▼</span>
      <span>PASO</span>
    </div>

    <!-- Feedback flash overlay -->
    <div class="feedback-flash" id="feedback-correct">
      <div class="feedback-emoji">🎉</div>
      <div class="feedback-label" style="color:var(--accent-green)">¡CORRECTO!</div>
    </div>
    <div class="feedback-flash" id="feedback-pass">
      <div class="feedback-emoji">👋</div>
      <div class="feedback-label" style="color:var(--accent-red)">PASO</div>
    </div>

    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar"></div>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="screen-results" class="screen">
    <div class="results-title">¡Fin del juego!</div>
    <div class="results-scores">
      <div class="result-block green">
        <div class="result-num" id="final-correct">0</div>
        <div class="result-label">Aciertos</div>
      </div>
      <div class="result-block red">
        <div class="result-num" id="final-pass">0</div>
        <div class="result-label">Pasos</div>
      </div>
    </div>
    <button class="btn-replay" id="btn-replay">JUGAR DE NUEVO</button>
  </div>

</div>

<script>
// ─── WORDS ───────────────────────────────────────────────
const words = [
  { word: "Elefante",      category: "Animal" },
  { word: "Volcán",        category: "Naturaleza" },
  { word: "Astronauta",    category: "Profesión" },
  { word: "Guitarra",      category: "Instrumento" },
  { word: "Pirámide",      category: "Monumento" },
  { word: "Mariposa",      category: "Animal" },
  { word: "Submarino",     category: "Transporte" },
  { word: "Helado",        category: "Comida" },
  { word: "Terremoto",     category: "Fenómeno" },
  { word: "Pijama",        category: "Ropa" },
  { word: "Pulpo",         category: "Animal" },
  { word: "Diccionario",   category: "Objeto" },
  { word: "Camarero",      category: "Profesión" },
  { word: "Hamaca",        category: "Mueble" },
  { word: "Relámpago",     category: "Naturaleza" },
  { word: "Faro",          category: "Lugar" },
  { word: "Cacahuete",     category: "Comida" },
  { word: "Paraguas",      category: "Objeto" },
  { word: "Brújula",       category: "Instrumento" },
  { word: "Murciélago",    category: "Animal" }
];

// ─── AUDIO (Web Audio API) ────────────────────────────────
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playCorrect() {
  try {
    const ctx = getAudioCtx();
    const times = [[0, 523.25], [0.12, 659.25], [0.24, 783.99]];
    times.forEach(([when, freq]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + when);
      gain.gain.setValueAtTime(0, ctx.currentTime + when);
      gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + when + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + when + 0.25);
      osc.start(ctx.currentTime + when);
      osc.stop(ctx.currentTime + when + 0.25);
    });
  } catch(e) {}
}

function playPass() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(330, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function playCountdown() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

function playGo() {
  try {
    const ctx = getAudioCtx();
    [0, 0.1, 0.2].forEach(when => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1046.5, ctx.currentTime + when);
      gain.gain.setValueAtTime(0.3, ctx.currentTime + when);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + when + 0.2);
      osc.start(ctx.currentTime + when);
      osc.stop(ctx.currentTime + when + 0.2);
    });
  } catch(e) {}
}

// ─── GAME STATE ───────────────────────────────────────────
let shuffled = [];
let currentIdx = 0;
let scoreCorrect = 0;
let scorePass = 0;
let gameActive = false;
let tiltCooldown = false;
let timerInterval = null;
let timerSeconds = 60;
let timerLeft = 60;

// ─── SCREEN TRANSITIONS ───────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── SHUFFLE ─────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── DISPLAY WORD ─────────────────────────────────────────
function showWord(idx) {
  const el = document.getElementById('word-text');
  const cat = document.getElementById('word-category');
  const idxEl = document.getElementById('word-index');

  el.classList.remove('word-animate');
  void el.offsetWidth;
  el.classList.add('word-animate');

  el.textContent = shuffled[idx].word;
  cat.textContent = shuffled[idx].category.toUpperCase();
  idxEl.textContent = idx + 1;

  setBg('neutral');
}

function setBg(state) {
  const bg = document.getElementById('game-bg');
  bg.className = 'game-bg ' + state;
}

// ─── FLASH FEEDBACK ───────────────────────────────────────
function flashFeedback(type) {
  const el = document.getElementById('feedback-' + type);
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 500);
}

// ─── TIMER ────────────────────────────────────────────────
function startTimer() {
  timerLeft = timerSeconds;
  updateTimerBar();
  timerInterval = setInterval(() => {
    timerLeft -= 0.1;
    updateTimerBar();
    if (timerLeft <= 0) endGame();
  }, 100);
}

function updateTimerBar() {
  const pct = Math.max(0, (timerLeft / timerSeconds) * 100);
  document.getElementById('timer-bar').style.width = pct + '%';
  const bar = document.getElementById('timer-bar');
  if (pct < 25) bar.style.background = 'var(--accent-red)';
  else if (pct < 50) bar.style.background = 'var(--accent-yellow)';
  else bar.style.background = 'var(--accent-yellow)';
}

function stopTimer() {
  clearInterval(timerInterval);
}

// ─── ACTIONS ──────────────────────────────────────────────
function doCorrect() {
  if (!gameActive || tiltCooldown) return;
  tiltCooldown = true;
  playCorrect();
  flashFeedback('correct');
  setBg('correct');
  scoreCorrect++;
  document.getElementById('score-correct').textContent = scoreCorrect;
  setTimeout(() => {
    setBg('neutral');
    tiltCooldown = false;
    nextWord();
  }, 600);
}

function doPass() {
  if (!gameActive || tiltCooldown) return;
  tiltCooldown = true;
  playPass();
  flashFeedback('pass');
  setBg('pass');
  scorePass++;
  document.getElementById('score-pass').textContent = scorePass;
  setTimeout(() => {
    setBg('neutral');
    tiltCooldown = false;
    nextWord();
  }, 600);
}

function nextWord() {
  currentIdx++;
  if (currentIdx >= shuffled.length) {
    endGame();
    return;
  }
  showWord(currentIdx);
}

// ─── TILT DETECTION ───────────────────────────────────────
let lastBeta = null;
const TILT_THRESHOLD = 30; // degrees from flat

function handleMotion(e) {
  if (!gameActive) return;
  const beta = e.beta; // front-back tilt: -180 to 180
  if (beta === null) return;

  // In landscape, beta=0 is flat on table, positive = tilted toward you (screen up)
  // We use gamma for landscape tilt since device is rotated

  // Actually for landscape use case, we'll use gamma
  const gamma = e.gamma; // left-right tilt in landscape becomes up-down
  if (gamma === null) return;

  if (lastBeta === null) { lastBeta = gamma; return; }

  if (gamma > TILT_THRESHOLD) {
    doCorrect();
  } else if (gamma < -TILT_THRESHOLD) {
    doPass();
  }
}

// ─── END GAME ─────────────────────────────────────────────
function endGame() {
  gameActive = false;
  stopTimer();
  window.removeEventListener('devicemotion', handleMotion);
  document.getElementById('final-correct').textContent = scoreCorrect;
  document.getElementById('final-pass').textContent = scorePass;
  setTimeout(() => showScreen('screen-results'), 300);
}

// ─── START FLOW ───────────────────────────────────────────
async function requestMotionPermission() {
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const res = await DeviceMotionEvent.requestPermission();
      return res === 'granted';
    } catch(e) { return false; }
  }
  return true; // non-iOS, no permission needed
}

function startCountdown(cb) {
  let n = 3;
  const el = document.getElementById('countdown');
  el.textContent = n;
  playCountdown();
  const iv = setInterval(() => {
    n--;
    if (n > 0) {
      el.textContent = n;
      playCountdown();
    } else {
      clearInterval(iv);
      el.textContent = '¡YA!';
      playGo();
      setTimeout(cb, 600);
    }
  }, 1000);
}

async function startGame() {
  // Unlock audio context on user gesture
  getAudioCtx();

  const granted = await requestMotionPermission();
  if (!granted) {
    alert('Necesitas permitir el acceso al sensor de movimiento para jugar.');
    return;
  }

  // Reset state
  shuffled = shuffle(words);
  currentIdx = 0;
  scoreCorrect = 0;
  scorePass = 0;
  document.getElementById('score-correct').textContent = '0';
  document.getElementById('score-pass').textContent = '0';
  document.getElementById('word-total').textContent = shuffled.length;
  setBg('neutral');

  showScreen('screen-ready');
  startCountdown(() => {
    showWord(0);
    showScreen('screen-game');
    gameActive = true;
    tiltCooldown = false;
    startTimer();
    window.addEventListener('devicemotion', handleMotion);
  });
}

// ─── KEYBOARD FALLBACK (desktop testing) ─────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')   doCorrect();
  if (e.key === 'ArrowDown') doPass();
});

// ─── BUTTONS ─────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-replay').addEventListener('click', startGame);

// ─── SERVICE WORKER ──────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ─── SWIPE FALLBACK (touch) ───────────────────────────────
let touchStartY = null;
document.getElementById('screen-game').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.getElementById('screen-game').addEventListener('touchend', e => {
  if (touchStartY === null) return;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dy) > 60) {
    if (dy < 0) doCorrect();
    else doPass();
  }
  touchStartY = null;
}, { passive: true });
</script>
